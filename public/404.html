<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Keanu Ace D. Bayona</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,300;1,400&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            background: #f7f7f7;
            color: #201f1f;
            text-align: center;
            padding: 2rem;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #121212;
                color: #e7e5e4;
            }

            .back-link {
                color: #e7e5e4;
            }

            .back-link:hover {
                color: #02BC9B;
            }
        }

        .container {
            max-width: 500px;
        }

        .error-code {
            font-family: 'Noto Serif', serif;
            font-size: clamp(5rem, 15vw, 10rem);
            font-weight: 300;
            line-height: 1;
            color: #02BC9B;
            margin-bottom: 1rem;
            letter-spacing: -0.05em;
        }

        .message {
            font-size: 1.1rem;
            font-weight: 300;
            color: #78716c;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 600;
            color: #201f1f;
            text-decoration: none;
            border: 1px solid #d6d3d1;
            padding: 0.875rem 2rem;
            border-radius: 9999px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            border-color: #02BC9B;
            color: #02BC9B;
            transform: scale(1.05);
        }

        .decoration {
            width: 60px;
            height: 3px;
            background: #02BC9B;
            margin: 0 auto 2rem;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="error-code">404</div>
        <div class="decoration"></div>
        <p class="message">
            This page doesn't exist in the system.<br>
            Looks like a broken route.
        </p>
        <a href="/KBayona/" class="back-link">
            ← Back to Portfolio
        </a>
    </div>
</body>

</html>

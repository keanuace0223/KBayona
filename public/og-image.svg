<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#02BC9B"/>
      <stop offset="100%" stop-color="#00E5BD"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#02BC9B" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="200" y1="0" x2="1200" y2="500"/>
    <line x1="400" y1="0" x2="1200" y2="400"/>
    <line x1="0" y1="200" x2="1000" y2="630"/>
    <line x1="0" y1="400" x2="600" y2="630"/>
  </g>
  <!-- Accent line -->
  <rect x="100" y="290" width="120" height="3" fill="url(#accent)" rx="1"/>
  <!-- Name -->
  <text x="100" y="270" font-family="Georgia, serif" font-size="64" fill="white" font-weight="300" letter-spacing="-2">Keanu Ace D. Bayona</text>
  <!-- Subtitle -->
  <text x="100" y="340" font-family="Inter, Arial, sans-serif" font-size="22" fill="#02BC9B" font-weight="600" letter-spacing="6" text-transform="uppercase">SYSTEMS ARCHITECT</text>
  <text x="100" y="375" font-family="Inter, Arial, sans-serif" font-size="18" fill="#888" font-weight="400" letter-spacing="4">&amp; FULL-STACK SOFTWARE ENGINEER</text>
  <!-- Domain -->
  <text x="100" y="560" font-family="Inter, Arial, sans-serif" font-size="14" fill="#555" letter-spacing="3">KEANUACE0223.GITHUB.IO/KBAYONA</text>
  <!-- Corner accent -->
  <rect x="0" y="0" width="4" height="630" fill="url(#accent)"/>
</svg>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Director & Systems Architect | Portfolio</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#201f1f",
                        "accent": "#02BC9B",
                        "background-light": "#f7f7f7",
                        "background-dark": "#121212",
                    },
                    fontFamily: {
                        "display": ["Noto Serif", "serif"],
                        "sans": ["Inter", "sans-serif"]
                    }
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-background-light dark:bg-background-dark text-primary dark:text-stone-200 font-sans selection:bg-accent selection:text-white transition-colors duration-300;
            }
            h1, h2, h3, .serif {
                @apply font-display;
            }
        }
        .hover-lift {
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .hover-lift:hover {
            transform: translateY(-8px);
        }
        .accent-glow:hover {
            box-shadow: 0 0 30px rgba(2, 188, 155, 0.2);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            @apply bg-transparent;
        }
        ::-webkit-scrollbar-thumb {
            @apply bg-stone-300 dark:bg-stone-700 rounded-full;
        }
    </style>
    <div id="root"></div>
<script type="module" src="/main.ts"></script>
</body>
</html>
